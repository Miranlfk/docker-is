# Tags and releases every <major>.<minor>.x branch (7.3.x, 7.2.x, ..., 5.7.x) when a PR is merged into it.
#
# This file only needs to exist on the default branch (master):
#  - pull_request_target always runs the default branch's workflow, whatever the PR's base branch is.
#  - schedule and workflow_dispatch also run from the default branch; schedule is a fallback that
#    picks up anything a PR-triggered run missed (e.g. a direct push or a blocked/failed run).
# Each run releases every branch whose head is ahead of its latest v<major>.<minor>.0.<N> tag,
# so runs are idempotent. PR code is never checked out or executed.
name: Release branches

on:
  pull_request_target:
    types: [closed]
    branches:
      - '[0-9]+.[0-9]+.x'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Space-separated release branches, e.g. "7.2.x 7.3.x". Leave empty for all.'
        required: false
        default: ''
      dry_run:
        description: 'Only print the tags and releases that would be created'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-branches
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Tag and release branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: bash .github/scripts/release-branches.sh

  # Opens a PR in the (private) Docker image build pipeline repository that bumps each product's
  # docker_release_version to its latest tag here. The repository's location is held only in secrets,
  # which GitHub masks in this public repository's logs. Skipped until the secrets are configured:
  #   PIPELINE_REPO_OWNER, PIPELINE_REPO_NAME, PIPELINE_BASE_BRANCH, PIPELINE_FILE_PATH
  #   and either PIPELINE_APP_ID + PIPELINE_APP_PRIVATE_KEY (GitHub App, preferred) or PIPELINE_TOKEN
  update-build-pipeline:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIPELINE_REPO_OWNER: ${{ secrets.PIPELINE_REPO_OWNER }}
      PIPELINE_REPO_NAME: ${{ secrets.PIPELINE_REPO_NAME }}
      PIPELINE_BASE_BRANCH: ${{ secrets.PIPELINE_BASE_BRANCH }}
      PIPELINE_FILE_PATH: ${{ secrets.PIPELINE_FILE_PATH }}
      HAS_APP: ${{ secrets.PIPELINE_APP_ID != '' }}
      HAS_TOKEN: ${{ secrets.PIPELINE_TOKEN != '' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [[ -n "$PIPELINE_REPO_OWNER" && -n "$PIPELINE_REPO_NAME" && -n "$PIPELINE_BASE_BRANCH" \
                && -n "$PIPELINE_FILE_PATH" && ( "$HAS_APP" == "true" || "$HAS_TOKEN" == "true" ) ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Build pipeline secrets are not configured; skipping the version update PR."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout default branch
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        if: steps.config.outputs.enabled == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: ${{ secrets.PIPELINE_REPO_OWNER }}
          repositories: ${{ secrets.PIPELINE_REPO_NAME }}

      - name: Open or update build pipeline PR
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          PIPELINE_REPO: ${{ secrets.PIPELINE_REPO_OWNER }}/${{ secrets.PIPELINE_REPO_NAME }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: bash .github/scripts/update-build-pipeline.sh
